    .top-thumbnails-container {
        position: absolute;

        justify-content: space-around;
        align-items: center;

    .thumbnail {
        width: 100px;
        height: 100px;
        border: 3px solid blue;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: border-color 0.3s ease-in-out;
    }
    .thumbnail.active {
        border: 3px solid;
        border-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet) 1;
        animation: rainbow-border 3s infinite linear;
    }
    @keyframes rainbow-border {
        0% { border-image-source: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet); }
        100% { border-image-source: linear-gradient(405deg, red, orange, yellow, green, blue, indigo, violet); }
    }
    .container {

        display: flex;
        justify-content: center;
        position: relative;
    }
    video {
        width: 80%;

        aspect-ratio: 16 / 9;
        background-color: black;

    <script>
 document.addEventListener('DOMContentLoaded', function() {
        const thumbnails = document.querySelectorAll('.thumbnail');
        const playPauseButton = document.querySelector('.play-pause i');
        const videoPlayer = document.querySelector('video');
        const videoTitleOverlay = document.querySelector('.video-title-overlay');
        const videoProducerOverlay = document.querySelector('.video-producer-overlay');
        const videoVersesOverlay = document.querySelector('.video-verses-overlay');


        // Function to update the play-pause button icon
        function updatePlayPauseIcon() {
            if (videoPlayer.paused || videoPlayer.ended) {
                playPauseButton.classList.remove('fa-pause');
                playPauseButton.classList.add('fa-play');
            } else {
                playPauseButton.classList.remove('fa-play');
                playPauseButton.classList.add('fa-pause');
            }
        }

        // Add click event listener to each thumbnail
        thumbnails.forEach(function(thumb, index) {
            thumb.addEventListener('click', function() {
                thumbnails.forEach(function(t) {
                    t.classList.remove('active');
                    t.style.borderColor = 'blue'; // Reset other thumbnails
                });
                this.classList.add('active');

                videoPlayer.src = this.dataset.videoUrl;
                videoPlayer.poster = this.style.backgroundImage.slice(5, -2); // Set poster to clicked thumbnail
                videoPlayer.pause(); // Ensure video is paused
                videoTitleOverlay.textContent = this.getAttribute('data-title'); // Update title overlay
				videoProducerOverlay.textContent = "Produced by " + this.getAttribute('data-producer'); // Update producer overlay
				videoVersesOverlay.textContent = this.getAttribute('data-verse-order'); // Update verses overlay

                updatePlayPauseIcon(); // Update play-pause icon
            });

            // Highlight the first thumbnail on page load
            if (index === 0) {
                thumb.classList.add('active');
                videoTitleOverlay.textContent = thumb.getAttribute('data-title'); // Set initial title
								videoProducerOverlay.textContent = "Produced by " + thumb.getAttribute('data-producer'); // Update producer overlay
				videoVersesOverlay.textContent = thumb.getAttribute('data-verse-order'); // Update verses overlay

            }
        });

        // Update play-pause icon on video play/pause events
        videoPlayer.addEventListener('play', updatePlayPauseIcon);
        videoPlayer.addEventListener('pause', updatePlayPauseIcon);

        // Initial icon state
        updatePlayPauseIcon();
    });    </script>
