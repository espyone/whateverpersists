
    <style>
        body {
            background-color: lightgrey; /* Light grey background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .thumbnail-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 10px; /* Reduced padding */
            position: relative;
        }
        .thumbnail {
            width: 100px; /* Thumbnail size reduced */
            height: 100px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid blue;
            cursor: pointer;
            position: relative;
        }
        .thumbnail-overlay {
            width: 50%;
            height: 75%;
            position: absolute;
            top: 12.5%; /* Center vertically */
            left: 25%; /* Center horizontally */
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Aldrich', sans-serif;
            color: yellow;
            font-size: 6rem; /* Increased font size */
            text-shadow: 5px 5px 5px black; /* Added drop shadow */
            pointer-events: none;
        }
        .thumbnail.active {
            border-color: yellow;
        }
        .videoContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }
        .videoWrapper {
            width: 80vw; /* 80% of viewport width */
            max-width: 80vw; /* Prevent it from exceeding 80% of the width */
            max-height: 80vh; /* Prevent it from exceeding 80% of the height */
            aspect-ratio: 16 / 9; /* Maintain 16:9 aspect ratio */
            position: relative;
            z-index: 1;
        }
        .videoIframe {
            width: 100%;
            height: 100%;
        }
        .title-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 2;
            pointer-events: none;
        }
        .title {
            width: 95%;
            height: 4px;
            opacity: 1;
            z-index: 4;
            font-size: 140%;
            font-family: 'Aldrich', sans-serif;
            color: white;
            position: absolute;
            top: 14px;
            left: 0;
            text-align: left;
            text-shadow: 1px 1px red;
            padding-left: 20px;  /* Ensure alignment with left edge of the video */
        }
    </style>
    <script>
        function loadVideo(title, videoUrl, thumbnailUrl, index) {
            const iframe = document.querySelector(".videoWrapper .videoIframe");
            iframe.src = videoUrl;
            document.querySelector(".title-overlay .title").textContent = title;
            document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }
    </script>
