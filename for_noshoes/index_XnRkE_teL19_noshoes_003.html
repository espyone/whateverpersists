<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Custom Video Player JavaScript | CodingNepal</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- These 3 links are only for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  
    <style>
    .top-thumbnails-container {
        position: absolute;
        top: 0;
        width: calc(100% - 300px); /* 150px padding on each side */
        padding: 20px 150px; /* Reduced vertical padding */
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: transparent;
    }
    .thumbnail {
        width: 100px;
        height: 100px;
        border: 3px solid blue;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: border-color 0.3s ease-in-out;
    }
    .thumbnail.active {
        border: 3px solid;
        border-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet) 1;
        animation: rainbow-border 3s infinite linear;
    }
    @keyframes rainbow-border {
        0% { border-image-source: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet); }
        100% { border-image-source: linear-gradient(405deg, red, orange, yellow, green, blue, indigo, violet); }
    }
    .container {
        margin-top: 160px; /* Adjusted for the new vertical position */
        display: flex;
        justify-content: center;
        position: relative;
    }
    video {
        width: 80%;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background-color: black;
    }
    .video-title-overlay {
        position: absolute;
        top: 0;
        left: 0;
        padding: 10px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 18px;
        z-index: 10;
        pointer-events: none;
        max-width: 80%;
    }
    </style>
    </head>
  <body><div class="top-thumbnails-container">
       <div class="thumbnail active" style="background-image: url('https://thumbs.odycdn.com/5782e459a868316d660c246e2b3e4818.webp');" data-video-url="https://player.odycdn.com/api/v3/streams/free/benjamins/93d44d9365229e3f976fcf3b447dd81fc7e11e35/ce3440.mp4" data-title="Puff Daddy featuring The LOX, Lil' Kim and The Notorious B.I.G.- It's All About The Benjamins"></div>
        
        <div class="thumbnail" style="background-image: url('https://thumbs.odycdn.com/c71f2c0269c546525c0991ad9cbc12df.webp');" data-video-url="https://player.odycdn.com/api/v3/streams/free/El-P-Tasmanian-Pain-Coaster/1be675fa5f43cb1a3bb178af1b4727f01951d68c/2391c1.mp4" data-title="El-P - Tasmanian Pain Coaster"></div>
        
        <div class="thumbnail" style="background-image: url('https://thumbs.odycdn.com/258b0052d0fe83db28e17c81e639659a.webp');" data-video-url="https://player.odycdn.com/api/v3/streams/free/Maxo-Kream-Work/7b3cf77b7126ab808e39fe4efe9b31c29aec85a3/f40be3.mp4" data-title="Maxo Kream - Work"></div>
        
        <div class="thumbnail" style="background-image: url('https://thumbs.odycdn.com/bc10755f5c6a5772f4bc5c5eaff4e706.webp');" data-video-url="https://t.ly/e1NIv" data-title="Killer Mike - Don't Die"></div>
        
        <div class="thumbnail" style="background-image: url('https://thumbs.odycdn.com/15b74d92aa95ad1a40951a04e1b6ef3e.webp');" data-video-url="https://player.odycdn.com/api/v3/streams/free/Edan-The-Science-of-the-Two/873c134aecaf6b5d9a26e0e168b6439d88dfee92/76f738.mp4" data-title="Edan and Insight - The Science Of The Two"></div>
        </div><div class="video-title-overlay"></div>
    <div class="container show-controls">
        <div class="wrapper">
            <div class="video-timeline">
                <div class="progress-area">
                    <span>00:00</span>
                    <div class="progress-bar"></div>
                </div>
            </div>
            <ul class="video-controls">
                <li class="options left">
                    <button class="volume"><i class="fa-solid fa-volume-high"></i></button>
                    <input type="range" min="0" max="1" step="any">
                    <div class="video-timer">
                        <p class="current-time">00:00</p>
                        <p class="separator"> / </p>
                        <p class="video-duration">00:00</p>
                    </div>
                </li>
                <li class="options center">
                    <button class="skip-backward"><i class="fas fa-backward"></i></button>
                    <button class="play-pause"><i class="fas fa-play"></i></button>
                    <button class="skip-forward"><i class="fas fa-forward"></i></button>
                </li>
                <li class="options right">
                    <div class="playback-content">
                        <button class="playback-speed"><span class="material-symbols-rounded">slow_motion_video</span></button>
                        <ul class="speed-options">
                            <li data-speed="2">2x</li>
                            <li data-speed="1.5">1.5x</li>
                            <li data-speed="1" class="active">Normal</li>
                            <li data-speed="0.75">0.75x</li>
                            <li data-speed="0.5">0.5x</li>
                        </ul>
                    </div>
                    <button class="pic-in-pic"><span class="material-icons">picture_in_picture_alt</span></button>
                    <button class="fullscreen"><i class="fa-solid fa-expand"></i></button>
                </li>
            </ul>
        </div>
        <video src="https://player.odycdn.com/api/v3/streams/free/benjamins/93d44d9365229e3f976fcf3b447dd81fc7e11e35/ce3440.mp4" poster="https://thumbs.odycdn.com/5782e459a868316d660c246e2b3e4818.webp"></video>
    </div>

    <script src="script.js"></script>

  
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const thumbnails = document.querySelectorAll('.thumbnail');
        const playPauseButton = document.querySelector('.play-pause i');
        const videoPlayer = document.querySelector('video');
        const videoTitleOverlay = document.querySelector('.video-title-overlay');

        // Function to update the play-pause button icon
        function updatePlayPauseIcon() {
            if (videoPlayer.paused || videoPlayer.ended) {
                playPauseButton.classList.remove('fa-pause');
                playPauseButton.classList.add('fa-play');
            } else {
                playPauseButton.classList.remove('fa-play');
                playPauseButton.classList.add('fa-pause');
            }
        }

        // Add click event listener to each thumbnail
        thumbnails.forEach(function(thumb, index) {
            thumb.addEventListener('click', function() {
                thumbnails.forEach(function(t) {
                    t.classList.remove('active');
                    t.style.borderColor = 'blue'; // Reset other thumbnails
                });
                this.classList.add('active');

                videoPlayer.src = this.dataset.videoUrl;
                videoPlayer.poster = this.style.backgroundImage.slice(5, -2); // Set poster to clicked thumbnail
                videoPlayer.pause(); // Ensure video is paused
                videoTitleOverlay.textContent = this.getAttribute('data-title'); // Update title overlay
                updatePlayPauseIcon(); // Update play-pause icon
            });

            // Highlight the first thumbnail on page load
            if (index === 0) {
                thumb.classList.add('active');
                videoTitleOverlay.textContent = thumb.getAttribute('data-title'); // Set initial title
            }
        });

        // Update play-pause icon on video play/pause events
        videoPlayer.addEventListener('play', updatePlayPauseIcon);
        videoPlayer.addEventListener('pause', updatePlayPauseIcon);

        // Initial icon state
        updatePlayPauseIcon();
    });
    </script>
    </body>
</html>
