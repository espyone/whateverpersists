        .videoWrapper {
            width: 80vw;

            max-height: 80vh;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            background: black;
        }
        .videoIframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
        .title-overlay {
            position: absolute;
            width: 100%;
            height: 100%;

            position: absolute;
            top: 14px;
            left: 0;
            text-align: left;
            text-shadow: 1px 1px red;
            padding-left: 20px;
        }
    </style>
