  <style>
    body {
      font-family: avenir, sans-serif;
      background-color: grey;
    }

    main {
      padding-top: 0;
      max-width: 700px;
      margin: 20px auto;
    }

    .pad { padding-bottom: 19.7px; }
    .padfoot { padding-bottom: 60px; }

    /* Shared shape for all spacers */
    .spacer, .spacer2, .spacer3 {
      position: relative;
      z-index: 3;
      top: 10px;
      padding: 9.9px;
      opacity: 1;
      width: 97.5%;
      border-radius: 48% 48% 0 0;
    }

    /* Colors */
    .spacer  { background-color: purple; }
    .spacer2 { background-color: blue; }
    .spacer3 { background-color: #7AC269; }

    .ytbutton {
      position: fixed;
      z-index: 16;
      right: 12px;
      bottom: 23px;
    }

    .title {
      width: 95%;
      opacity: 1;
      z-index: 4;
      font-size: 140%;
      font-family: 'Aldrich', sans-serif;
      color: white;
      position: relative;
      top: 35px;
      text-align: left;
      text-shadow: 1px 1px red;
    }

    .videoWrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      background-color: #000;
      overflow: hidden;
    }

    /* Aspect ratios using data-aspect */
    .videoWrapper[data-aspect="169"] { padding-top: 56.25%; } /* 16:9 */
    .videoWrapper[data-aspect="43"]  { padding-top: 75%; }    /* 4:3 */

    .videoIframe {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%;
      background-color: transparent;
    }

    .videoPoster {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%;
      cursor: pointer;
      border: 0; outline: none;
      background-size: cover;
      background-position: center;
      text-indent: -999em;
      overflow: hidden;
      opacity: 1;
      transition: opacity 800ms, height 0s;
    }
    .videoPoster:before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 80px; height: 80px;
      margin: -40px 0 0 -40px;
      border: 5px solid #fff;
      border-radius: 100%;
      transition: border-color 300ms;
    }
    .videoPoster:after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      margin: -20px 0 0 -10px;
      border-left: 40px solid #fff;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      transition: border-color 300ms;
    }
    .videoPoster:hover:before,
    .videoPoster:focus:before { border-color: #f00; }
    .videoPoster:hover:after,
    .videoPoster:focus:after { border-left-color: #f00; }
    .videoWrapperActive .videoPoster {
      opacity: 0;
      height: 0;
      transition-delay: 0s, 800ms;
    }

    .sticker {
      position: absolute;
      right: 9px;
	  transform: rotate(3deg);
      top: 11px;
      z-index: 3;
      width: 43px;        /* fixed small size */
      height: auto;
      max-width: 19%;     /* responsive scaling */
      opacity: 1;
    }

    .container {
      position: fixed;
      z-index: 5;
      left: 57%;
      top: -40px;
      width: 300px;
      height: 300px;
    }

    .a, .b, .c {
      font-family: 'Fredoka One', cursive;
      position: absolute;
      font-size: 35px;
      top: 50px;
      left: -100px;
      width: 100vh;
      text-shadow: 2px 2px black;
    }
    .a { color: #432b72; z-index: 3; animation: shuffle_a 3s linear 3s infinite; }
    .b { color: blue; z-index: 2; animation: shuffle_b 3s linear 3s infinite; }
    .c { color: orange; z-index: 1; animation: shuffle_c 3s linear 6s infinite; }

    /* Keyframes unchanged (omitted for brevity, same as before) */
  </style>
</head>

  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Custom Script -->
  <script>
    $(document).on('click', '.js-videoPoster', function (ev) {
      ev.preventDefault();
      var $poster = $(this);
      var $wrapper = $poster.closest('.js-videoWrapper');
      videoPlay($wrapper);
    });

    function videoPlay($wrapper) {
      var $iframe = $wrapper.find('.js-videoIframe');
      var src = $iframe.data('src') || $iframe.attr('src');
      $wrapper.addClass('videoWrapperActive');
      $iframe.attr('src', src);
    }

    function videoStop($wrapper) {
      if (!$wrapper) {
        $wrapper = $('.js-videoWrapper');
        $iframe = $('.js-videoIframe');
      } else {
        $iframe = $wrapper.find('.js-videoIframe');
      }
      $wrapper.removeClass('videoWrapperActive');
      $iframe.attr('src', '');
    }
  </script>
