    /* Shared shape for all spacers */
    .spacer, .spacer2, .spacer3 {

      top: 10px;
      padding: 9.9px;
      opacity: 1;
      width: 97.5%;
      border-radius: 48% 48% 0 0;
    }

    /* Colors */
    .spacer  { background-color: purple; }
    .spacer2 { background-color: blue; }
    .spacer3 { background-color: #7AC269; }

    .ytbutton {
      position: fixed;
      z-index: 16;

    }

    .title {
      width: 95%;
      opacity: 1;
      z-index: 4;
      font-size: 140%;
      font-family: 'Aldrich', sans-serif;
      color: white;
      position: relative;
      top: 35px;
      text-align: left;
      text-shadow: 1px 1px red;
    }
	.title2 {
      width: 95%;
      opacity: 1;
      z-index: 4;
      font-size: 80%;
      font-family: 'Aldrich', sans-serif;
      color: white;
      position: relative;
      top: 35px;
      text-align: left;
      text-shadow: 1px 1px red;
    }

    .videoWrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      background-color: #000;
      overflow: hidden;
    }

    /* Aspect ratios using data-aspect */
    .videoWrapper[data-aspect="169"] { padding-top: 56.25%; } /* 16:9 */
    .videoWrapper[data-aspect="43"]  { padding-top: 75%; }    /* 4:3 */

    .videoIframe {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%;
      background-color: transparent;
    }

    .videoPoster {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%;
      cursor: pointer;
      border: 0; outline: none;
      background-size: cover;
      background-position: center;
      text-indent: -999em;
      overflow: hidden;
      opacity: 1;
      transition: opacity 800ms, height 0s;
    }
    .videoPoster:before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 80px; height: 80px;
      margin: -40px 0 0 -40px;
      border: 5px solid #fff;
      border-radius: 100%;
      transition: border-color 300ms;
    }
    .videoPoster:after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      margin: -20px 0 0 -10px;
      border-left: 40px solid #fff;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      transition: border-color 300ms;
    }
    .videoPoster:hover:before,
    .videoPoster:focus:before { border-color: #f00; }
    .videoPoster:hover:after,
    .videoPoster:focus:after { border-left-color: #f00; }
    .videoWrapperActive .videoPoster {
      opacity: 0;
      height: 0;
      transition-delay: 0s, 800ms;
    }

    .sticker {
      position: absolute;
      right: 9px;
      top: 11px;
      z-index: 3;
      width: 43px;        /* fixed small size */
      height: auto;
      max-width: 19%;     /* responsive scaling */
      opacity: .65;

      /* resting pose */
      transform: rotate(3deg) scale(1);
      transition: transform 0.4s cubic-bezier(.68,-0.55,.27,1.55);
    }

    @keyframes stickerLoop {
      0%   { transform: rotate(3deg) scale(1); }
      8.3% { transform: rotate(5deg) scale(1.05); }
      16.6%{ transform: rotate(2deg) scale(1); }
      25%  { transform: rotate(0deg) scale(0.95); }
      33.3%{ transform: rotate(-2deg) scale(1); }
      41.6%{ transform: rotate(-4deg) scale(1.05); }
      50%  { transform: rotate(-2deg) scale(1); }
      58.3%{ transform: rotate(0deg) scale(0.95); }
      66.6%{ transform: rotate(2deg) scale(1); }
      75%  { transform: rotate(4deg) scale(1.05); }
      83.3%{ transform: rotate(2deg) scale(1); }
      91.6%{ transform: rotate(0deg) scale(0.90); }
      100% { transform: rotate(3deg) scale(1); }
    }

    .sticker.playing {
      animation-name: stickerLoop;
      animation-iteration-count: infinite;
      animation-timing-function: steps(12, end);
      transition: none; /* disable spring transition while looping */
    }

    .container {
      position: fixed;
      z-index: 5;
      left: 57%;
      top: -40px;
      width: 300px;
      height: 300px;
    }

    .a, .b, .c {
      font-family: 'Fredoka One', cursive;
      position: absolute;
      font-size: 35px;
      top: 50px;
      left: -100px;
      width: 100vh;
      text-shadow: 2px 2px black;
    }
    .a { color: #432b72; z-index: 3; animation: shuffle_a 3s linear 3s infinite; }
    .b { color: blue; z-index: 2; animation: shuffle_b 3s linear 3s infinite; }
    .c { color: orange; z-index: 1; animation: shuffle_c 3s linear 6s infinite; }
  </style>
</head>

  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Sticker Control Script -->
  <script>
  document.querySelectorAll('video').forEach(function(video) {
    const sticker = video.closest('.videoWrapper').querySelector('.sticker');

    function setRandomDuration() {
      const randomTime = (Math.random() * 2 + 2).toFixed(2); // 2s–4s
      sticker.style.animationDuration = randomTime + "s";
    }

    video.addEventListener('play', function() {
      sticker.classList.add('playing');
      setRandomDuration();
    });

    video.addEventListener('pause', function() {
      sticker.classList.remove('playing');
      sticker.style.animationDuration = "";
    });

    video.addEventListener('ended', function() {
      sticker.classList.remove('playing');
      sticker.style.animationDuration = "";
    });

    sticker.addEventListener('animationiteration', function() {
      if (sticker.classList.contains('playing')) {
        setRandomDuration();
      }
    });
  });
  </script>
