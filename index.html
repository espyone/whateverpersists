<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Webamp — Minimal Loader (diagnostics)</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body{
    margin:0; background:#0b0b0b; color:#ddd; font-family:sans-serif;
    display:flex; align-items:center; justify-content:center; /* center Webamp */
  }
  #webamp-anchor { position: relative; width:0; height:0; }
  #status {
    position: fixed; left: 12px; bottom: 12px; right: 12px;
    background: #111; border: 1px solid #333; padding: 8px 10px;
    font: 12px/1.4 system-ui, sans-serif; color: #cfd7df; border-radius: 6px;
    max-height: 35vh; overflow:auto; white-space: pre-wrap;
  }
  #status b { color: #9ad; }
</style>

<!-- Webamp only (no skin fetch, no tag reader) -->
<script defer src="https://cdn.jsdelivr.net/npm/webamp@2.2.0/built/webamp.bundle.min.js"></script>
</head>
<body>
  <div id="webamp-anchor">
    <div id="webamp-target"></div>
  </div>
  <div id="status" aria-live="polite">starting…</div>

<script>
(function(){
  const $status = document.getElementById("status");
  const log = (...args) => { $status.textContent += "\\n" + args.join(" "); };
  $status.textContent = "loading…";

  // Show JS errors on the page so a blank screen never hides the problem
  window.onerror = function(msg, src, line, col, err){
    log("❌ JS error:", msg, src||"", line||"", col||"");
  };
  window.addEventListener("unhandledrejection", e => {
    log("❌ Unhandled promise rejection:", e.reason && (e.reason.stack || e.reason.message || e.reason));
  });

  // Clear any old Webamp skin pointers that might cause popup attempts
  try {
    Object.keys(localStorage).forEach(k => {
      const lk = k.toLowerCase();
      if (lk.includes("webamp") && (lk.includes("skin") || lk.includes("persist"))) {
        localStorage.removeItem(k);
      }
    });
  } catch {}

  // Wait for Webamp to be available
  const waitForWebamp = () => new Promise(res=>{
    const id = setInterval(()=>{ if (window.Webamp){ clearInterval(id); res(); } }, 25);
    setTimeout(()=>{ clearInterval(id); log("⚠️ Webamp library not found."); }, 15000);
  });

  (async () => {
    await waitForWebamp();

    // Build fixed list: music/01.ogg … music/18.ogg relative to this page
    const MUSIC_DIR = new URL("./music/", location.href);
    const START = 1, END = 18, EXT = ".ogg";
    const files = Array.from({length: END - START + 1}, (_, i) => String(i + START).padStart(2, "0") + EXT);
    const tracks = files.map(fn => {
      const url = new URL(fn, MUSIC_DIR).href;
      const title = fn.replace(/\.[^.]+$/, "");
      return { url, defaultName: title, metaData: { title, artist: "" } };
    });

    log("• building track list from", MUSIC_DIR.href);
    log("• first track:", tracks[0].url);
    log("• last  track:", tracks[tracks.length-1].url);

    // Create Webamp (uses built-in default skin — no external fetch)
    const webamp = new Webamp({
      enableHotkeys: true,
      __initialWindowLayout: {
        main:     { position: { x: -150, y: -80 } },
        playlist: { position: { x: -150, y:  40 }, size: [0, 4] }
        // equalizer omitted
      },
      initialTracks: tracks
    });

    try {
      await webamp.renderWhenReady(document.getElementById("webamp-target"));
      try { webamp.store.dispatch({ type: "CLOSE_WINDOW", windowId: "equalizer" }); } catch {}
      log("✅ player rendered.");
      $status.textContent = "ready. (click to hide)";
      $status.onclick = () => ($status.style.display = "none");
    } catch (e) {
      log("❌ render error:", e && (e.stack || e.message || e));
    }

    // Optional lightweight checks (will not block UI)
    setTimeout(async () => {
      let missing = 0;
      for (const t of tracks) {
        try {
          const r = await fetch(t.url, { method:"HEAD", cache:"no-store" });
          if (!r.ok) { missing++; log("⚠️", r.status, t.url); }
        } catch (err) { missing++; log("⚠️ fetch error", t.url, err && err.message); }
      }
      if (missing) log(`⚠️ ${missing} file(s) missing or blocked (see lines above).`);
    }, 300);
  })();
})();
</script>
</body>
</html>
