<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Webamp — Auto 01..18 with Tag Titles</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0b0b0b;
    color: #ddd;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;   /* center Webamp */
  }
  /* Anchor so we can position windows relative to page center */
  #webamp-anchor { position: relative; width: 0; height: 0; }
  #msg { position: fixed; left: 12px; bottom: 12px; font-size: 12px; opacity: .85; }
  code { background:#222; padding:0 4px; border-radius:3px; }
</style>

<!-- Webamp (Winamp in JS) -->
<script defer src="https://cdn.jsdelivr.net/npm/webamp@2.2.0/built/webamp.bundle.min.js"></script>
<!-- Tag reader (OGG Vorbis comments, ID3, etc.) -->
<script defer src="https://cdn.jsdelivr.net/npm/music-metadata-browser/dist/music-metadata-browser.min.js"></script>
</head>
<body>
  <div id="webamp-anchor">
    <div id="webamp-target"></div>
  </div>
  <div id="msg" aria-live="polite"></div>

<script>
(async () => {
  // ====== CONFIG ======
  // Use your hosted music path (works locally too if it's the same domain):
  const BASE_URL = "https://whateverpersists.com/music/";
  // If you prefer local files in the repo instead, use:
  // const BASE_URL = new URL("./music/", location.href).href;

  const START_NUM = 1;         // 01.ogg
  const END_NUM   = 18;        // ...18.ogg
  const EXT       = ".ogg";
  const SKIN_PATH = new URL("./skins/base-2.91.wsz", location.href).href; // self-hosted skin

  const $msg = document.getElementById("msg");
  const say = (t) => ($msg.innerHTML = t || "");
  const waitForWebamp = () => new Promise(res=>{
    const id = setInterval(()=>{ if (window.Webamp){ clearInterval(id); res(); }}, 25);
  });

  // Clear any cached CDN skin so it won't try to re-fetch a broken URL
  try {
    Object.keys(localStorage).forEach(k => {
      const lk = k.toLowerCase();
      if (lk.includes("webamp") && (lk.includes("skin") || lk.includes("persist"))) {
        localStorage.removeItem(k);
      }
    });
  } catch {}

  await waitForWebamp();

  // Build 01..18 filenames
  function buildList(start, end, ext) {
    const arr = [];
    for (let i = start; i <= end; i++) {
      arr.push(String(i).padStart(2, "0") + ext);
    }
    return arr;
  }

  // Helpers to read tags from remote URL; fallback to filename if CORS/parse fails
  function basenameNoExt(u) {
    const base = u.split("/").pop().split("?")[0].split("#")[0];
    return base.replace(/\.[^.]+$/, "");
  }

  async function readTagsFromUrl(url) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const { parseBlob } = window.musicMetadata || {};
      if (!parseBlob) throw new Error("music-metadata not ready");
      const meta = await parseBlob(blob);
      const c = (meta && meta.common) || {};
      const t = c.track && (typeof c.track === "object" ? c.track.no : c.track);
      const d = c.disk  && (typeof c.disk  === "object" ? c.disk.no  : c.disk);
      return {
        title: c.title || null,
        artist: c.artist || c.albumartist || "",
        track: (t!=null && !Number.isNaN(Number(t))) ? Number(t) : null,
        disc:  (d!=null && !Number.isNaN(Number(d))) ? Number(d) : null
      };
    } catch {
      return null; // title fallback to filename
    }
  }

  // Build track references with nice titles
  const files = buildList(START_NUM, END_NUM, EXT);
  const urls  = files.map(fn => new URL(fn, BASE_URL).href);

  say("Loading tracks…");
  const refs = await Promise.all(urls.map(async (u) => {
    const md = await readTagsFromUrl(u); // may be null if CORS/parse fails
    const title  = (md && md.title)  || basenameNoExt(u);
    const artist = (md && md.artist) || "";
    return { url: u, defaultName: title, metaData: { title, artist } };
  }));

  // Spin up Webamp, centered, with your local skin; keep EQ closed
  const webamp = new Webamp({
    enableHotkeys: true,
    initialSkin: { url: SKIN_PATH },
    __initialWindowLayout: {
      main:     { position: { x: -150, y: -80 } },
      playlist: { position: { x: -150, y:  40 }, size: [0, 4] }
      // equalizer intentionally omitted
    },
    initialTracks: refs
  });

  await webamp.renderWhenReady(document.getElementById("webamp-target"));
  try { webamp.store.dispatch({ type: "CLOSE_WINDOW", windowId: "equalizer" }); } catch {}

  // Optional: quickly warn if any URLs 404 (kept lightweight)
  let missing = 0;
  for (const r of refs) {
    try {
      const head = await fetch(r.url, { method: "HEAD", cache: "no-store" });
      if (!head.ok) { missing++; console.warn("Missing:", r.url, head.status); }
    } catch (e) { missing++; console.warn("Error:", r.url, e); }
  }
  say(missing ? `Loaded ${refs.length - missing}/${refs.length}. Some files are missing or blocked (see console).`
              : `Loaded ${refs.length} tracks from <code>${BASE_URL}</code>. Click to hide.`);
  $msg.onclick = () => say("");
})();
</script>
</body>
</html>
