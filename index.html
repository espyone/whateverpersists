<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APlayer – M3U + Covers + Producer</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0b0b;
    color: #e6e6e6;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .wrap {
    width: min(900px, 92vw);
    padding: 24px;
    background: #121212;
    border: 1px solid #242424;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }

  #aplayer { margin-top: 0; }

  .status {
    margin-top: 10px;
    font-size: 12px;
    opacity: .8;
  }

  /* ---------- APlayer color tweaks ---------- */

  .aplayer {
    background-color: #f9f9f9 !important;
    border-radius: 12px !important;
    border: 1px solid #ddd !important;
  }

  /* Allow Now Playing to wrap */
  .aplayer-title {
    color: #000 !important;
    font-weight: 600 !important;
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
  }

  /* Hide default author text */
  .aplayer-author {
    display: none !important;
  }

  /* Playlist columns */
  .aplayer-list-title {
    color: #000 !important;
    font-weight: 500 !important;
  }
  .aplayer-list-author {
    color: #444 !important;
  }

  /* Progress bar + active row tint */
  .aplayer-bar .aplayer-played {
    background-color: #1db954 !important;
  }
  .aplayer-list li.aplayer-list-light {
    background-color: #1db95422 !important;
  }

  /* ---------- Now Playing typography (desktop) ---------- */

  .now-title {
    color: #000 !important;
    font-size: 15px;
    font-weight: 700;
  }

  .now-artist {
    color: #333 !important;
    font-size: 14px;
    font-weight: 500;
    margin-left: 8px;
  }

  .now-producer {
    color: #3182ff !important;
    font-size: 11px;
    font-weight: 600;
    margin-left: 8px;
  }

  /* -------- Mobile tweaks (1/3 size) -------- */
  @media (max-width: 600px) {

    .wrap {
      width: 100vw;
      padding: 10px;
      border-radius: 0;
    }

    .aplayer {
      border-radius: 8px !important;
    }

    .aplayer-title {
      display: block !important;
      line-height: 1.2 !important;
      white-space: normal !important;
    }

    /* Shrink all Now-Playing fonts to 1/3 */
    .now-title {
      font-size: 5px !important;     /* 15px → ~1/3 */
      display: block;
    }
    .now-artist {
      font-size: 4.5px !important;   /* 14px → ~1/3 */
      display: block;
      margin-left: 0;
      margin-top: 2px;
    }
    .now-producer {
      font-size: 3.5px !important;   /* 11px → ~1/3 */
      display: block;
      margin-left: 0;
      margin-top: 1px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="aplayer"></div>
    <div id="status" class="status">Loading…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>

<script>
(async () => {
  const status = (t) => { document.getElementById('status').textContent = t || ""; };

  const MUSIC_DIR     = new URL("./music/", location.href);
  const DEFAULT_COVER = new URL("cover_default.jpg", MUSIC_DIR).href;

  async function fetchText(url) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) return null;
      return await r.text();
    } catch {
      return null;
    }
  }

  // Parse M3U with producer + cover
  function parseM3UWithCoversAndProducer(txt, baseUrl, defaultCover) {
    const out = [];
    const lines = txt.split(/\r?\n/);
    let pending = { title: null, artist: null, cover: null, producer: null };

    for (let raw of lines) {
      if (!raw) continue;
      const line = raw.trim();
      if (!line) continue;

      if (line.toUpperCase().startsWith("#EXTINF:")) {
        const m = line.match(/^#EXTINF:[^,]*,(.*)$/i);
        const info = (m ? m[1] : "").trim();

        let artist   = "";
        let titleRaw = info;
        const dashIdx = info.indexOf(" - ");

        if (dashIdx > -1) {
          artist   = info.slice(0, dashIdx).trim();
          titleRaw = info.slice(dashIdx + 3).trim();
        }

        // Producer -=X=- pattern
        let producer = null;
        const pm = titleRaw.match(/-\=([^=]+)=-/);
        if (pm) {
          producer = pm[1].trim();
          titleRaw = titleRaw.replace(/-\=[^=]+=-/, "").trim();
        }

        pending.title    = titleRaw || null;
        pending.artist   = artist   || "";
        pending.producer = producer || null;
        continue;
      }

      if (line.toUpperCase().startsWith("#EXTIMG:")) {
        const imgPath = line.replace(/^#EXTIMG:/i, "").trim();
        if (imgPath) pending.cover = new URL(imgPath, baseUrl).href;
        continue;
      }

      if (line.startsWith("#")) continue;

      // Audio file
      const audioUrl = new URL(line, baseUrl).href;
      const fallback = line.split("/").pop().replace(/\.[^.]+$/, "");

      out.push({
        title:    pending.title    || fallback,
        artist:   pending.artist   || "",
        producer: pending.producer || null,
        url:      audioUrl,
        cover:    pending.cover    || defaultCover
      });

      pending = { title: null, artist: null, cover: null, producer: null };
    }

    return out;
  }

  function fallbackTracks(count = 18, ext = ".ogg") {
    const arr = [];
    for (let i = 1; i <= count; i++) {
      const fn = String(i).padStart(2, "0") + ext;
      arr.push({
        title: fn.replace(/\.[^.]+$/, ""),
        artist: "",
        producer: null,
        url: new URL(fn, MUSIC_DIR).href,
        cover: DEFAULT_COVER
      });
    }
    return arr;
  }

  status("Looking for playlist…");

  let text = await fetchText(new URL("playlist.m3u", MUSIC_DIR));
  if (!text) text = await fetchText(new URL("playlist.m3u8", MUSIC_DIR));

  let tracks = text
    ? parseM3UWithCoversAndProducer(text, MUSIC_DIR, DEFAULT_COVER)
    : fallbackTracks();

  if (!tracks.length) tracks = fallbackTracks();

  // Build Now Playing HTML from parsed track
  function formatDisplay(t) {
    const titleHTML  = `<span class="now-title">${t.title}</span>`;
    const artistHTML = t.artist   ? `<span class="now-artist">${t.artist}</span>` : "";
    const prodHTML   = t.producer ? `<span class="now-producer">(${t.producer})</span>` : "";
    return `${titleHTML} ${artistHTML} ${prodHTML}`;
  }

  const audioList = tracks.map(t => ({
    name: t.title,
    artist: t.artist,
    url: t.url,
    cover: t.cover,
    displayHTML: formatDisplay(t)
  }));

  const ap = new APlayer({
    container: document.getElementById('aplayer'),
    fixed: false,
    autoplay: false,
    theme: '#1db954',
    loop: 'all',
    order: 'list',
    listFolded: false,
    lrcType: 0,
    audio: audioList
  });

  function refreshNowPlaying() {
    const idx = ap.list.index;
    const track = audioList[idx];
    const titleEl = document.querySelector('.aplayer-title');
    if (titleEl && track) titleEl.innerHTML = track.displayHTML;
  }

  ap.on('play', refreshNowPlaying);
  ap.on('listswitch', refreshNowPlaying);
  ap.on('loadedmetadata', refreshNowPlaying);

  status("Ready.");
})();
</script>
</body>
</html>
