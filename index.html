<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Whatever Persists Dec 2025 Mix</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0b0b;
    color: #e6e6e6;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .wrap {
    width: min(900px, 92vw);
    padding: 24px;
    background: #121212;
    border: 1px solid #242424;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }

  #aplayer { margin-top: 0; }

  .status {
    margin-top: 10px;
    font-size: 12px;
    opacity: .8;
  }

  /* ---------- APlayer color tweaks ---------- */

  .aplayer {
    background-color: #f9f9f9 !important;
    border-radius: 12px !important;
    border: 1px solid #ddd !important;
  }

  /* We override the title content ourselves */
  .aplayer-title {
    color: #000 !important;
    font-weight: 600 !important;
  }

  /* Hide default author text – we fold it into the title line */
  .aplayer-author {
    display: none !important;
  }

  /* Playlist row titles */
  .aplayer-list-title {
    color: #000 !important;
    font-weight: 500 !important;
  }

  /* Playlist row artists */
  .aplayer-list-author {
    color: #444 !important;
  }

  /* Progress bar + active row tint */
  .aplayer-bar .aplayer-played {
    background-color: #1db954 !important;
  }
  .aplayer-list li.aplayer-list-light {
    background-color: #1db95422 !important;
  }

  /* ---------- Now Playing typography ---------- */

  /* Title (big, black) */
  .now-title {
    color: #000 !important;
    font-size: 18px;
    font-weight: 700;
  }

  /* Artist (dark gray, smaller) */
  .now-artist {
    color: #333 !important; /* ~20% lighter than black */
    font-size: 10px;        /* smaller than title */
    font-weight: 500;
    margin-left: 8px;
  }

  /* Producer info (blue, smallest) */
  .now-producer {
  color: #3182ff !important;
  font-size: 16px;        /* was 14px → now 20% smaller */
  font-weight: 600;
  margin-left: 8px;
}
</style>
</head>
<body>
  <div class="wrap">
    <div id="aplayer"></div>
    <div id="status" class="status">Loading…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>

<script>
(async () => {
  const status = (t) => { document.getElementById('status').textContent = t || ""; };

  const MUSIC_DIR     = new URL("./music/", location.href);
  const DEFAULT_COVER = new URL("cover_default.jpg", MUSIC_DIR).href;

  async function fetchText(url) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) return null;
      return await r.text();
    } catch {
      return null;
    }
  }

  // Parse M3U / M3U8:
  //   #EXTINF:0,Artist - Title -=Producer=-
  //   #EXTIMG:cover.jpg
  //   <audio path>
  //
  // Returns array of { title, artist, producer, url, cover }
  function parseM3UWithCoversAndProducer(txt, baseUrl, defaultCover) {
    const out = [];
    const lines = txt.split(/\r?\n/);
    let pending = { title: null, artist: null, cover: null, producer: null };

    for (let raw of lines) {
      if (!raw) continue;
      const line = raw.trim();
      if (!line) continue;

      // #EXTINF line
      if (line.toUpperCase().startsWith("#EXTINF:")) {
        const m = line.match(/^#EXTINF:[^,]*,(.*)$/i);
        const info = (m ? m[1] : "").trim();

        let artist   = "";
        let titleRaw = info;

        const dashIdx = info.indexOf(" - ");
        if (dashIdx > -1) {
          artist   = info.slice(0, dashIdx).trim();
          titleRaw = info.slice(dashIdx + 3).trim();
        }

        // Producer inside -= ... =-
        let producer = null;
        const pm = titleRaw.match(/-\=([^=]+)=-/);
        if (pm) {
          producer = pm[1].trim();
          titleRaw = titleRaw.replace(/-\=[^=]+=-/, "").trim();
        }

        pending.title    = titleRaw || null;
        pending.artist   = artist   || "";
        pending.producer = producer || null;
        continue;
      }

      // #EXTIMG line
      if (line.toUpperCase().startsWith("#EXTIMG:")) {
        const imgPath = line.replace(/^#EXTIMG:/i, "").trim();
        if (imgPath) {
          pending.cover = new URL(imgPath, baseUrl).href;
        }
        continue;
      }

      // Other comments
      if (line.startsWith("#")) continue;

      // Audio path line
      const audioUrl = new URL(line, baseUrl).href;
      const baseName = line.split("/").pop();
      const fallbackTitle = baseName.replace(/\.[^.]+$/, "");

      out.push({
        title:    pending.title    || fallbackTitle,
        artist:   pending.artist   || "",
        producer: pending.producer || null,
        url:      audioUrl,
        cover:    pending.cover    || defaultCover
      });

      // reset for next track
      pending = { title: null, artist: null, cover: null, producer: null };
    }

    return out;
  }

  // Fallback 01.ogg..18.ogg without producer
  function fallbackTracks(count = 18, ext = ".ogg", baseUrl = MUSIC_DIR, defaultCover = DEFAULT_COVER) {
    const arr = [];
    for (let i = 1; i <= count; i++) {
      const fn = String(i).padStart(2, "0") + ext;
      arr.push({
        title: fn.replace(/\.[^.]+$/, ""),
        artist: "",
        producer: null,
        url: new URL(fn, baseUrl).href,
        cover: defaultCover
      });
    }
    return arr;
  }

  // Load playlist or fallback
  status("Looking for music/playlist.m3u…");
  let text = await fetchText(new URL("playlist.m3u", MUSIC_DIR).href);
  if (!text) {
    status("Looking for music/playlist.m3u8…");
    text = await fetchText(new URL("playlist.m3u8", MUSIC_DIR).href);
  }

  let tracks = [];
  if (text) {
    tracks = parseM3UWithCoversAndProducer(text, MUSIC_DIR, DEFAULT_COVER);
    if (!tracks.length) {
      status("Playlist found but empty or malformed; using fallback 01..18.");
      tracks = fallbackTracks();
    } else {
      status(`Loaded ${tracks.length} track(s) from playlist.`);
    }
  } else {
    status("No playlist found; using fallback 01..18.");
    tracks = fallbackTracks();
  }

  // Build formatted HTML display for Now Playing
  function formatDisplay(t) {
    const titleHTML  = `<span class="now-title">${t.title}</span>`;
    let artistHTML   = "";
    let producerHTML = "";

    if (t.artist) {
      artistHTML = `<span class="now-artist">${t.artist}</span>`;
    }
    if (t.producer) {
      producerHTML = `<span class="now-producer">(${t.producer})</span>`;
    }

    return `${titleHTML} ${artistHTML} ${producerHTML}`;
  }

  // Build audio list for APlayer, with extra displayHTML field
  const audioList = tracks.map(t => ({
    name: t.title,        // playlist left column
    artist: t.artist,     // playlist right column
    url: t.url,
    cover: t.cover,
    displayHTML: formatDisplay(t)
  }));

  const ap = new APlayer({
    container: document.getElementById('aplayer'),
    fixed: false,
    autoplay: false,
    theme: '#1db954',
    loop: 'all',
    order: 'list',
    listFolded: false,
    lrcType: 0,
    audio: audioList  // APlayer ignores extra fields like displayHTML
  });

  // Override the Now Playing bar content using displayHTML
  function refreshNowPlaying() {
    const idx = ap.list.index;
    const track = audioList[idx];
    const titleEl = document.querySelector('.aplayer-title');
    if (!titleEl || !track) return;
    titleEl.innerHTML = track.displayHTML;
  }

  ap.on('play', refreshNowPlaying);
  ap.on('listswitch', refreshNowPlaying);
  ap.on('loadedmetadata', refreshNowPlaying);

  status("Ready.");
})();
</script>
</body>
</html>
