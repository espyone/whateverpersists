<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Webamp — Auto 01..18 with Tag Titles (Partial Fetch)</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body{
    margin:0; background:#0b0b0b; color:#ddd; font-family:sans-serif;
    display:flex; align-items:center; justify-content:center;  /* center Winamp */
  }
  #webamp-anchor { position: relative; width: 0; height: 0; }
  #msg { position: fixed; left: 12px; bottom: 12px; font-size: 12px; opacity: .85; }
</style>

<!-- Webamp only (we update titles by resetting refs once tags are known) -->
<script defer src="https://cdn.jsdelivr.net/npm/webamp@2.2.0/built/webamp.bundle.min.js"></script>
<!-- Tag reader -->
<script defer src="https://cdn.jsdelivr.net/npm/music-metadata-browser/dist/music-metadata-browser.min.js"></script>
</head>
<body>
  <div id="webamp-anchor">
    <div id="webamp-target"></div>
  </div>
  <div id="msg" aria-live="polite"></div>

<script>
(async () => {
  const $msg = document.getElementById("msg");
  const say = (t) => ($msg.textContent = t || "");

  // Wipe any cached skin pointers to avoid CDN popups
  try {
    Object.keys(localStorage).forEach(k => {
      const lk = k.toLowerCase();
      if (lk.includes("webamp") && (lk.includes("skin") || lk.includes("persist"))) {
        localStorage.removeItem(k);
      }
    });
  } catch {}

  // Wait for libs
  await new Promise(r => {
    const id = setInterval(() => { if (window.Webamp && window.musicMetadata) { clearInterval(id); r(); } }, 25);
  });

  // --- Config ---
  const MUSIC_DIR = new URL("./music/", location.href);
  const START = 1, END = 18, EXT = ".ogg";
  const RANGE_BYTES = 256 * 1024; // read first 256 KB only
  const CONCURRENCY = 3;          // parse up to 3 files at once (tune as needed)

  // Build initial track refs using filenames (instant)
  const files = Array.from({length: END - START + 1}, (_,i) =>
    String(i + START).padStart(2, "0") + EXT
  );
  const urls = files.map(fn => new URL(fn, MUSIC_DIR).href);

  let refs = urls.map(u => {
    const title = u.split("/").pop().replace(/\.[^.]+$/, "");
    return { url: u, defaultName: title, metaData: { title, artist: "" } };
  });

  // Create player with default skin (no external fetch), centered windows
  const webamp = new Webamp({
    enableHotkeys: true,
    __initialWindowLayout: {
      main:     { position: { x: -150, y: -80 } },
      playlist: { position: { x: -150, y:  40 }, size: [0, 4] }
    },
    initialTracks: refs
  });

  say("Loading player…");
  await webamp.renderWhenReady(document.getElementById("webamp-target"));
  try { webamp.store.dispatch({ type: "CLOSE_WINDOW", windowId: "equalizer" }); } catch {}
  say(""); // clear

  // ---- Background tag upgrade using partial range fetch ----
  const { parseBlob } = window.musicMetadata;

  async function readTagsPartial(url) {
    // Try HEAD first (optional)
    try { await fetch(url, { method: "HEAD", cache: "no-store" }); } catch {}
    // Partial fetch (needs Accept-Ranges on server; most have it)
    try {
      const res = await fetch(url, {
        cache: "no-store",
        headers: { Range: `bytes=0-${RANGE_BYTES-1}` }
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const meta = await parseBlob(blob);
      const c = meta.common || {};
      const title  = c.title  || null;
      const artist = c.artist || c.albumartist || "";
      const trk    = c.track && (typeof c.track === "object" ? c.track.no : c.track);
      const dsk    = c.disk  && (typeof c.disk  === "object" ? c.disk.no  : c.disk);
      return {
        title, artist,
        track: (trk!=null && !Number.isNaN(Number(trk))) ? Number(trk) : null,
        disc:  (dsk!=null && !Number.isNaN(Number(dsk))) ? Number(dsk) : null
      };
    } catch (e) {
      return null;
    }
  }

  // Limit concurrency
  async function mapLimit(items, limit, fn) {
    const out = new Array(items.length);
    let i = 0, running = 0;
    return await new Promise((resolve) => {
      function next() {
        while (running < limit && i < items.length) {
          const idx = i++;
          running++;
          fn(items[idx], idx).then(val => { out[idx] = val; })
                             .catch(() => { out[idx] = null; })
                             .finally(() => { running--; (i >= items.length && running === 0) ? resolve(out) : next(); });
        }
      }
      next();
    });
  }

  say("Reading tags… (background)");
  const tagResults = await mapLimit(urls, CONCURRENCY, readTagsPartial);

  // If we got at least one tag, rebuild refs with improved titles
  let upgraded = false;
  refs = refs.map((r, idx) => {
    const md = tagResults[idx];
    if (md && (md.title || md.artist)) {
      upgraded = true;
      const title = md.title || r.metaData.title;
      return { url: r.url, defaultName: title, metaData: { title, artist: md.artist || "" } };
    }
    return r;
  });

  if (upgraded) {
    // Warning: resetting refs may restart playback. To avoid that,
    // only apply when nothing is playing:
    let isPlaying = false;
    try {
      const state = webamp.store.getState();
      // naive check; if we can't detect, just apply anyway
      isPlaying = state.media && state.media.status === "PLAYING";
    } catch {}

    if (!isPlaying) {
      await webamp.setTracksFromReferences(refs);
      say("Titles updated from tags. (Click to hide)");
    } else {
      say("Tags read. Titles will update when you stop playback.");
      // Optional: wait a bit then apply anyway (commented)
      // setTimeout(async () => { await webamp.setTracksFromReferences(refs); say(""); }, 1000);
    }
  } else {
    say(""); // nothing to update
  }
})();
</script>
</body>
</html>
