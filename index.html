<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=.71, maximum-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>Whatever Persists</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Fredoka+One&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: avenir, sans-serif;
      background-color: grey;
    }

    main {
      padding-top: 0;
      max-width: 700px;
      margin: 20px auto;
    }

    .pad { padding-bottom: 19.7px; }
    .padfoot { padding-bottom: 60px; }

    .spacer, .spacer2, .spacer3 {
      position: relative;
      z-index: 3;
      top: 10px;
      padding: 9.9px;
      opacity: 1;
      width: 97.5%;
      border-radius: 48% 48% 0 0;
    }
    .spacer  { background-color: purple; }
    .spacer2 { background-color: blue; }
    .spacer3 { background-color: #7AC269; }

    .title {
      width: 95%;
      opacity: 1;
      z-index: 4;
      font-size: 140%;
      font-family: 'Aldrich', sans-serif;
      color: white;
      position: relative;
      top: 35px;
      text-align: left;
      text-shadow: 1px 1px red;
    }
    .title2 {
      width: 95%;
      opacity: 1;
      z-index: 4;
      font-size: 80%;
      font-family: 'Aldrich', sans-serif;
      color: white;
      position: relative;
      top: 35px;
      text-align: left;
      text-shadow: 1px 1px red;
    }

    .videoWrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      background-color: #000;
      overflow: hidden;
    }

    .videoWrapper[data-aspect="169"] { padding-top: 56.25%; }
    .videoWrapper[data-aspect="43"]  { padding-top: 75%; }

    .videoIframe {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%;
      background: transparent;
      z-index: 1; /* main video */
    }

    .sticker {
      position: absolute;
      right: 9px;
      top: 11px;
      width: 84px;
      height: auto;
      opacity: .95;
      transform: rotate(3deg) scale(1);
      transition: transform 0.4s cubic-bezier(.68,-0.55,.27,1.55);
      z-index: 2; /* above main video but below overlay */
    }

    @keyframes stickerLoop {
      0%   { transform: rotate(3deg) scale(1); }
      8.3% { transform: rotate(5deg) scale(1.05); }
      16.6%{ transform: rotate(2deg) scale(1); }
      25%  { transform: rotate(0deg) scale(0.95); }
      33.3%{ transform: rotate(-2deg) scale(1); }
      41.6%{ transform: rotate(-4deg) scale(1.05); }
      50%  { transform: rotate(-2deg) scale(1); }
      58.3%{ transform: rotate(0deg) scale(0.95); }
      66.6%{ transform: rotate(2deg) scale(1); }
      75%  { transform: rotate(4deg) scale(1.05); }
      83.3%{ transform: rotate(2deg) scale(1); }
      91.6%{ transform: rotate(0deg) scale(0.90); }
      100% { transform: rotate(3deg) scale(1); }
    }

    .sticker.playing {
      animation-name: stickerLoop;
      animation-iteration-count: infinite;
      animation-timing-function: steps(12, end);
      transition: none;
    }

    #overlayVideo {
      z-index: 4; /* always above sticker + main video */
      pointer-events: none;
    }

    .controls {
      margin-top: 20px;
      text-align: center;
    }
    .controls button {
      margin: 5px;
      padding: 10px 15px;
      font-family: 'Aldrich', sans-serif;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    /* Global captions styling */
    video::cue {
      font-size: 22px;
      color: cyan;
      background: transparent;
      text-shadow: 2px 2px 4px black;
    }
  </style>
</head>

<body>
<main>
  <div class="container">
    <div class="a">whatever persists</div>
  </div>

  <!-- ===================== MAIN PLAYER ===================== -->
  <section class="videoSection">
    <div id="videoTitle" class="title">EPMD - Richter Scale</div>
    <div id="videoSpacer" class="spacer spacer2"></div> 
    <div id="videoWrapper" class="videoWrapper" data-aspect="43">
      <img class="sticker" src="./newindex_files/9hMDWSa.png" alt="Parental Advisory">

      <video id="mainVideo" class="videoIframe" controls playsinline poster="https://i.imgur.com/TxicWJ9.jpeg">
        <source id="mainSource" src="https://archive.org/serve/epmd-richter_scale/EPMD%20-%20Richter%20Scale%20%28Compressed%29.mp4" type="video/mp4">
      </video>

      <video id="overlayVideo" class="videoIframe" playsinline muted loop style="opacity:1; mix-blend-mode:hard-light;">
        <source id="overlaySource" src="https://archive.org/serve/1output-alpha/167782-837438539_43.webm" type="video/webm">
      </video>
    </div>
  </section>

  <!-- ===================== CONTROLS (Carousel) ===================== -->
  <div class="controls">
     <button onclick="loadVideo(
      'Ghostface Killah - Daytona 500',
      'spacer3',
      '43',
      'https://archive.org/serve/ghostface_killah-daytona_500/daytona500.mp4',
      './newindex_files/GFKINFO.jpg',
      null,
      '167782-837438539'
    )">Ghostface KIllah - Daytona 500</button>

    <button onclick="loadVideo(
      'Bone Crusher - Never Scared (Remix)',
      'spacer3',
      '43',
      'https://archive.org/serve/bone_crusher-never_scared_remix/BCREMIX_VIDEO.mp4',
      './newindex_files/BCINFO.jpg',
      null,
      '167782-837438539'
    )">Bone Crusher - Never Scared (Remix)</button>

    <button onclick="loadVideo(
      'Dead Prez - Hip Hop',
      'spacer2',
      '169',
      'https://archive.org/serve/1output-alpha/Caswell%2BDP_Fix.mp4',
      './newindex_files/DPINFO.jpg',
      null,
      '167782-837438539'
    )">Dead Prez - Hip Hop (vs Caswell Berry "Bag Of Suck" part)</button>


    <button onclick="loadVideo(
      'Outkast - Elevators (Me & You)',
      'spacer3',
      '169',
      'https://archive.org/serve/outkast-elevators/Outkast%20-%20Elevators%20%28Me%20%26%20You%29%20.mp4',
      './newindex_files/OKINFO.jpg',
      'http://whateverpersists.com/subtitles/outkast-elevators.vtt',
      '167782-837438539'
    )">Outkast- Elevators</button>
  </div>

  <div class="padfoot"></div>
</main>

<!-- jQuery -->
<script src="./newindex_files/jquery-3.6.0.min.js"></script>

<script>
// Sticker animation control
document.querySelectorAll('video').forEach(function(video) {
  const sticker = video.closest('.videoWrapper')?.querySelector('.sticker');
  if (!sticker) return;
  function setRandomDuration() {
    const randomTime = (Math.random() * 2 + 2).toFixed(2);
    sticker.style.animationDuration = randomTime + "s";
  }
  video.addEventListener('play', function() {
    sticker.classList.add('playing');
    setRandomDuration();
  });
  video.addEventListener('pause', function() {
    sticker.classList.remove('playing');
    sticker.style.animationDuration = "";
  });
  video.addEventListener('ended', function() {
    sticker.classList.remove('playing');
    sticker.style.animationDuration = "";
  });
  sticker.addEventListener('animationiteration', function() {
    if (sticker.classList.contains('playing')) setRandomDuration();
  });
});

const main = document.getElementById('mainVideo');
const overlay = document.getElementById('overlayVideo');

// === RANDOM START + RANDOM SPEED ===
function randomizeOverlay() {
  if (overlay.duration) {
    const randomTime = Math.random() * overlay.duration;
    overlay.currentTime = randomTime;
  }
  overlay.playbackRate = (Math.random() * 1.5 + 0.5).toFixed(2);
}

overlay.addEventListener("loadedmetadata", () => {
  randomizeOverlay();
});
overlay.addEventListener("ended", () => {
  randomizeOverlay();
  overlay.play();
});
main.addEventListener("play", () => {
  randomizeOverlay();
  overlay.play();
});
main.addEventListener("pause", () => overlay.pause());
main.addEventListener("seeking", () => {
  if (overlay.duration) {
    overlay.currentTime = main.currentTime % overlay.duration;
  }
});

// Carousel loader with captions + overlay
function loadVideo(title, spacerClass, aspect, src, poster, vttFile, overlayBase) {
  const videoTitle = document.getElementById("videoTitle");
  const videoSpacer = document.getElementById("videoSpacer");
  const videoWrapper = document.getElementById("videoWrapper");
  const mainVideo = document.getElementById("mainVideo");
  const mainSource = document.getElementById("mainSource");
  const overlayVideo = document.getElementById("overlayVideo");
  const overlaySource = document.getElementById("overlaySource");

  videoTitle.textContent = title;
  videoSpacer.className = "spacer " + spacerClass;
  videoWrapper.setAttribute("data-aspect", aspect);

  mainVideo.pause();
  mainSource.src = src;
  mainVideo.poster = poster;

  // remove old captions
  const oldTracks = mainVideo.querySelectorAll("track");
  oldTracks.forEach(track => track.remove());

  // add new captions if provided
  if (vttFile) {
    const track = document.createElement("track");
    track.src = vttFile;
    track.kind = "subtitles";
    track.srclang = "en";
    track.label = "English";
    track.default = true;
    mainVideo.appendChild(track);
  }

  // reload main video
  mainVideo.load();

  // force captions on if present
  mainVideo.addEventListener("loadedmetadata", () => {
    for (let i = 0; i < mainVideo.textTracks.length; i++) {
      mainVideo.textTracks[i].mode = "showing";
    }
  }, { once: true });

  // overlay logic (always load an overlay)
  overlaySource.src = `https://archive.org/serve/1output-alpha/${overlayBase}_${aspect}.webm`;
  overlayVideo.load();
}

// 🔊 set main video volume to 40% at page load
window.addEventListener("DOMContentLoaded", () => {
  const mainVideo = document.getElementById("mainVideo");
  if (mainVideo) {
    mainVideo.volume = 0.4;
  }
});
</script>
</body>
</html>
