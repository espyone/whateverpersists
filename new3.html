<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APlayer – M3U + Covers</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0b0b;
    color: #e6e6e6;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .wrap {
    width: min(900px, 92vw);
    padding: 24px;
    background: #121212;
    border: 1px solid #242424;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }

  /* APlayer sits alone now, no header/meta text */
  #aplayer { margin-top: 0; }

  .status {
    margin-top: 10px;
    font-size: 12px;
    opacity: .8;
  }
  code {
    background:#1c1c1c;
    padding:0 4px;
    border-radius:3px;
  }

  /* ---------- APlayer color tweaks ---------- */

  /* Main player background */
  .aplayer {
    background-color: #f9f9f9 !important;
    border-radius: 12px !important;
    border: 1px solid #ddd !important;
  }

  /* Top bar title (now playing) */
  .aplayer-title {
    color: #000 !important;          /* black title */
    font-weight: 600 !important;
  }

  /* Playlist row titles */
  .aplayer-list-title {
    color: #000 !important;          /* black track titles in list */
    font-weight: 500 !important;
  }

  /* Playlist row artists */
  .aplayer-list-author {
    color: #444 !important;
  }

  /* Producer highlight (the bit between -= and =-) */
  .producer {
    color: #3182ff !important;       /* blue producer text */
    font-weight: 600 !important;
  }

  /* Keep the green accent (you can change this) */
  .aplayer-bar .aplayer-played {
    background-color: #1db954 !important;
  }
  .aplayer-list li.aplayer-list-light {
    background-color: #1db95422 !important;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="aplayer"></div>
    <div id="status" class="status">Loading…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>

<script>
(async () => {
  const status = (t) => { document.getElementById('status').textContent = t || ""; };

  const MUSIC_DIR     = new URL("./music/", location.href);
  const DEFAULT_COVER = new URL("cover_default.jpg", MUSIC_DIR).href;

  async function fetchText(url) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) return null;
      return await r.text();
    } catch {
      return null;
    }
  }

  // Parse M3U / M3U8 with #EXTINF + #EXTIMG
  // Returns array of { name, artist, url, cover }
  function parseM3UWithCovers(txt, baseUrl, defaultCover) {
    const out = [];
    const lines = txt.split(/\r?\n/);
    let pending = { title: null, artist: null, cover: null };

    for (let raw of lines) {
      if (!raw) continue;
      const line = raw.trim();
      if (!line) continue;

      // #EXTINF:0,Artist - Title (whatever)
      if (line.toUpperCase().startsWith("#EXTINF:")) {
        const m = line.match(/^#EXTINF:[^,]*,(.*)$/i);
        const info = (m ? m[1] : "").trim();

        let artist = "";
        let title  = info;

        const dashIdx = info.indexOf(" - ");
        if (dashIdx > -1) {
          artist = info.slice(0, dashIdx).trim();
          title  = info.slice(dashIdx + 3).trim();
        }

        pending.title  = title  || null;
        pending.artist = artist || "";
        continue;
      }

      // #EXTIMG:cover-file.jpg (relative to music/)
      if (line.toUpperCase().startsWith("#EXTIMG:")) {
        const imgPath = line.replace(/^#EXTIMG:/i, "").trim();
        if (imgPath) {
          pending.cover = new URL(imgPath, baseUrl).href;
        }
        continue;
      }

      if (line.startsWith("#")) {
        continue; // other comments
      }

      // Audio path
      const audioUrl = new URL(line, baseUrl).href;
      const baseName = line.split("/").pop();
      const fallback = baseName.replace(/\.[^.]+$/, "");

      out.push({
        name:   pending.title  || fallback,
        artist: pending.artist || "",
        url:    audioUrl,
        cover:  pending.cover  || defaultCover
      });

      pending = { title: null, artist: null, cover: null };
    }

    return out;
  }

  // Fallback 01.ogg..18.ogg
  function fallbackTracks(count = 18, ext = ".ogg", baseUrl = MUSIC_DIR, defaultCover = DEFAULT_COVER) {
    const arr = [];
    for (let i = 1; i <= count; i++) {
      const fn = String(i).padStart(2, "0") + ext;
      arr.push({
        name: fn.replace(/\.[^.]+$/, ""),
        artist: "",
        url: new URL(fn, baseUrl).href,
        cover: defaultCover
      });
    }
    return arr;
  }

  // Load playlist or fallback
  status("Looking for music/playlist.m3u…");
  let text = await fetchText(new URL("playlist.m3u", MUSIC_DIR).href);
  if (!text) {
    status("Looking for music/playlist.m3u8…");
    text = await fetchText(new URL("playlist.m3u8", MUSIC_DIR).href);
  }

  let tracks = [];
  if (text) {
    tracks = parseM3UWithCovers(text, MUSIC_DIR, DEFAULT_COVER);
    if (!tracks.length) {
      status("Playlist found but empty or malformed; using fallback 01..18.");
      tracks = fallbackTracks();
    } else {
      status(`Loaded ${tracks.length} track(s) from playlist.`);
    }
  } else {
    status("No playlist found; using fallback 01..18.");
    tracks = fallbackTracks();
  }

  // When sending titles to APlayer, wrap producer section (-=...=-) so it can be blue
  const audioList = tracks.map(t => ({
    name: t.name.replace(/-\=([^=]+)=-/g, '-=<span class="producer">$1</span>=-'),
    artist: t.artist,
    url: t.url,
    cover: t.cover
  }));

  const ap = new APlayer({
    container: document.getElementById('aplayer'),
    fixed: false,
    autoplay: false,
    theme: '#1db954',    // green progress / highlight
    loop: 'all',
    order: 'list',
    listFolded: false,
    lrcType: 0,
    audio: audioList
  });

  status("Ready.");
})();
</script>
</body>
</html>
